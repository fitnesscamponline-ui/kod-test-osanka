<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Тест осанки КОД</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@200;300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: одна сцена на весь экран. Сверху «студия» с Женей (камера двигается между шагами),
   снизу тонкая панель с вопросом и двумя кнопками. Светлый монохром, красный только у зоны напряжения. */
:root{
  --paper:#ffffff; --studio:#eeeeeb; --floor:#e4e4e0; --ink:#0d0d0f; --ink2:#5e5e66; --hair:rgba(13,13,15,.12);
  --heat:#ff4a3d;
  --sans:"Inter Tight",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --cam:cubic-bezier(.65,0,.25,1); --out:cubic-bezier(.2,.8,.2,1);
  color-scheme:light;
}
html,body{height:100%;overflow:hidden}
body{background:var(--paper);color:var(--ink);font:15px/1.45 var(--sans);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
/* бесшовная студийная циклорама: стена сверху темнее, к полу светлеет, свет сверху по центру */
.app{position:relative;max-width:480px;height:100%;margin:0 auto;overflow:hidden;background:
  radial-gradient(90% 45% at 50% 30%,rgba(255,255,255,.35),transparent 70%),
  linear-gradient(to bottom,#c4c5c9 0%,#cdced2 22%,#d6d7da 42%,#e0e1e3 56%,#e8e8ea 66%,#eeeeef 80%,#f2f2f3 100%)}

/* верх */
.hud{position:absolute;z-index:20;left:0;right:0;top:0;display:flex;align-items:center;gap:14px;
  padding:calc(12px + env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) 0 max(18px,env(safe-area-inset-left,0px))}
.mark{font:500 13px var(--sans);letter-spacing:.32em;padding-left:.32em}
.prog{flex:1;display:flex;gap:4px;opacity:0;transition:opacity .6s}
.prog i{flex:1;height:2px;background:var(--hair);overflow:hidden;border-radius:1px}
.prog i b{display:block;height:100%;width:0;background:var(--ink);transition:width 1s var(--cam)}
[data-step="q1"] .prog,[data-step="q2"] .prog,[data-step="q3"] .prog{opacity:1}
.nav{width:34px;height:34px;border-radius:50%;border:1px solid var(--hair);background:rgba(255,255,255,.6);backdrop-filter:blur(10px);display:grid;place-items:center;cursor:pointer;transition:opacity .4s,transform .2s}
.nav:active{transform:scale(.9)}
.nav[hidden]{display:grid!important;opacity:0;pointer-events:none}
.cnt{font:400 11px var(--mono);letter-spacing:.08em;color:var(--ink2);min-width:38px;text-align:right}

/* сцена */
.stage{position:absolute;left:0;right:0;top:0;height:64%;perspective:1100px;perspective-origin:50% 40%}
.word{position:absolute;left:50%;top:16%;transform:translateX(-50%);white-space:nowrap;font:200 min(26vw,124px)/1 var(--sans);letter-spacing:-.04em;
  color:transparent;-webkit-text-stroke:1px rgba(255,255,255,.7);transition:opacity .7s,letter-spacing 1.4s var(--cam),transform 1.4s var(--cam);user-select:none}
.word.swap{opacity:0;letter-spacing:.06em}
[data-step="intro"] .word{top:10.5%}
.word{transition:opacity .7s,letter-spacing 1.4s var(--cam),transform 1.4s var(--cam),top 1.4s var(--cam)}

/* интро: до → после */
.ba{position:absolute;z-index:2;left:0;right:0;top:30%;bottom:-10%;display:flex;justify-content:center;align-items:flex-end;gap:9%;
  transform:translateX(calc(var(--ry,0deg) / 1deg * -1.2px));transition:opacity .9s var(--cam),transform 1.5s var(--cam),filter 1s}
.ba img{height:100%;width:auto;max-width:44%;object-fit:contain;object-position:bottom;display:block;
  -webkit-mask-image:linear-gradient(to bottom,#000 74%,transparent 97%);mask-image:linear-gradient(to bottom,#000 74%,transparent 97%)}
.ba .b1{animation:baL 1.2s var(--out) .15s both}
.ba .b2{animation:baR 1.3s var(--out) .85s both}
@keyframes baL{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
@keyframes baR{from{opacity:0;transform:translateX(24px) scale(.97);filter:brightness(1.25) blur(4px)}to{opacity:1;transform:none;filter:none}}
.ba .arr{position:absolute;left:50%;top:34%;width:44px;height:20px;transform:translateX(-50%);overflow:visible}
.ba .arr path{fill:none;stroke:var(--ink);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw .7s var(--cam) .6s forwards}
.ba .arr g{animation:nudge 1.8s ease-in-out 1.6s infinite}
@keyframes nudge{50%{transform:translateX(5px)}}
[data-step]:not([data-step="intro"]) .ba{opacity:0;visibility:hidden;transform:scale(1.06);pointer-events:none;transition:opacity .28s ease-out,transform .4s ease-out,visibility 0s .3s}
[data-step="intro"] .side{opacity:0}
/* пол студии: горизонт мягко скругляется (циклорама), к зрителю пол светлеет */
.floor{position:absolute;left:-60%;right:-60%;top:66%;bottom:-40%;
  background:linear-gradient(to bottom,rgba(222,223,226,0) 0%,#dedfe2 9%,#e5e6e8 26%,#ebebed 50%,#f0f0f1 80%)}
.floor::before{content:"";position:absolute;left:30%;right:30%;top:6%;height:40%;background:radial-gradient(50% 50% at 50% 40%,rgba(255,255,255,.55),transparent 70%)}
.dolly{position:absolute;inset:0;transform-style:preserve-3d}
.cam{position:absolute;inset:0;transform-style:preserve-3d;transition:transform 1.5s var(--cam)}
[data-step="q1"] .cam{transform:translateY(4%) scale(1.06)}
[data-step="q2"] .cam{transform:translateX(4%)}
[data-step="q3"] .cam{transform:translateY(16%) scale(.86)}
[data-step="final"] .cam{transform:scale(1.02)}

/* Женя сбоку (петля движения) */
.side{position:absolute;left:50%;bottom:4%;height:88%;aspect-ratio:408/1092;transform:translateX(-50%) rotateY(var(--ry,0deg));transform-style:preserve-3d;
  transition:opacity 1s var(--cam),filter 1.2s,transform 1.5s var(--cam)}
.side canvas{position:absolute;inset:0;width:100%;height:100%}
/* тень: контактная под стопами + отброшенная — тот же кадр Жени, сплющенный и положенный на пол */
.shadow{position:absolute;left:-12%;right:-4%;bottom:-1.6%;height:4.5%;border-radius:50%;background:radial-gradient(closest-side,rgba(30,30,38,.55),rgba(30,30,38,.12) 65%,transparent);filter:blur(2px)}
#cvs{transform-origin:50% 99%;transform:scaleY(.24) skewX(-52deg);filter:brightness(0) blur(5px);opacity:.18}
/* скан как в «сканере тела»: полоса проходит сверху вниз и показывает рентген */
#cvx{filter:grayscale(1) invert(.82) contrast(1.35) brightness(.8) sepia(.9) hue-rotate(168deg) saturate(2.6) drop-shadow(0 0 5px rgba(120,210,255,.9));clip-path:inset(0 0 100% 0);opacity:.95;
  -webkit-mask-image:repeating-linear-gradient(0deg,#000 0 1px,rgba(0,0,0,.62) 1px 2.5px);mask-image:repeating-linear-gradient(0deg,#000 0 1px,rgba(0,0,0,.62) 1px 2.5px)}
.beam{position:absolute;left:-30%;right:-30%;top:0;height:2px;background:linear-gradient(90deg,transparent,rgba(120,210,255,.95) 30%,#fff 50%,rgba(120,210,255,.95) 70%,transparent);
  box-shadow:0 0 18px 4px rgba(120,210,255,.55);opacity:0}
.scan #cvx{animation:xray 3.4s var(--cam) forwards}
.scan .beam{animation:beam 3.4s var(--cam) forwards}
@keyframes xray{0%{clip-path:inset(0 0 100% 0)}12%{clip-path:inset(0 0 82% 0)}50%{clip-path:inset(30% 0 38% 0)}88%{clip-path:inset(80% 0 0 0)}100%{clip-path:inset(100% 0 0 0)}}
@keyframes beam{0%{top:0;opacity:0}6%{opacity:1}94%{opacity:1}100%{top:100%;opacity:0}}
.warm #cvx{filter:sepia(1) saturate(4) hue-rotate(-18deg) contrast(1.25) brightness(1.05) drop-shadow(0 0 8px rgba(255,120,60,.7))}
.warm .beam{background:linear-gradient(90deg,transparent,rgba(255,150,80,.95) 30%,#fff 50%,rgba(255,150,80,.95) 70%,transparent);box-shadow:0 0 18px 4px rgba(255,130,60,.5)}
[data-step="q1"] .side{opacity:0;transform:translateX(-50%) rotateY(80deg) scale(1.25);filter:blur(6px)}
[data-step="q3"] .side{opacity:.16;filter:blur(1.5px) grayscale(1)}

/* Стена в тесте: вырастает из пола от спины Жени и уходит вглубь под углом */
/* трапеция в перспективе: ближний край у спины во всю высоту, дальний короче и сходится к горизонту */
/* стена идёт на зрителя: ближний край слева большой (уходит за кадр), к спине Жени сужается вглубь */
.wall{position:absolute;right:97.6%;bottom:-14%;width:80%;height:130%;opacity:0;
  background:linear-gradient(to right,#c9cacd 0%,#d6d7da 40%,#e3e4e6 85%,#eaeaec 100%);
  clip-path:polygon(0 100%,100% 89%,100% 89%,0 100%);transition:clip-path 1.3s var(--cam),opacity .4s}
.wall::after{content:"";position:absolute;inset:0;background:linear-gradient(186deg,transparent 80%,rgba(30,30,38,.14) 92%,transparent 100%)}
[data-step="q2"] .wall{clip-path:polygon(0 0,100% 10%,100% 89%,0 100%);opacity:1;transition-delay:.45s}
[data-step="q2"] #cvs{transform:scaleY(.2) skewX(-30deg);opacity:.14}


/* шаг 2: настоящая студия-угол с белой стеной (фото), Женя из видео стоит на месте Жени с фото */
.roombg{position:absolute;inset:-10%;z-index:3;background:linear-gradient(to bottom,#b9babf 0%,#c8c9cd 28%,#d6d7da 48%,#e6e6e9 62%,#f1f1f2 80%,#f6f6f7 100%);opacity:0;transition:opacity .6s;pointer-events:none}
.room{position:absolute;z-index:3;left:50%;top:-8%;height:108%;aspect-ratio:850/1850;transform:translateX(-50%);opacity:0;transition:opacity .6s;pointer-events:none;
  -webkit-mask-image:linear-gradient(to right,transparent,#000 14%,#000 86%,transparent);mask-image:linear-gradient(to right,transparent,#000 14%,#000 86%,transparent)}
.room>img{position:absolute;inset:0;width:100%;height:100%;display:block}
.rfig{position:absolute;left:31.8%;top:11.6%;width:63.8%;height:78.4%}
.rfig canvas{position:absolute;inset:0;width:100%;height:100%}
#cvw{display:none}
[data-step="q2"] .roombg,[data-step="q2"] .room{opacity:1}
[data-step="q2"] .side{opacity:0}
[data-step="q2"] .word{z-index:4;-webkit-text-stroke-color:rgba(255,255,255,.95)}
.word{z-index:1}
.flash{position:absolute;inset:0;z-index:15;pointer-events:none;opacity:0;background:radial-gradient(circle at 50% 40%,#fff 0%,rgba(255,255,255,.9) 35%,rgba(255,255,255,0) 75%)}
.room.pins{-webkit-mask-image:none;mask-image:none;z-index:4}
.room .pin{opacity:0;transition:opacity .6s}
[data-step="q2"] .room .pin{opacity:1;transition-delay:1.5s}
.wall{display:none}


/* шаг 3: ролик из Remotion — три варианта во весь экран, отметки рисуются по очереди */
.vvid{position:absolute;z-index:3;left:0;right:0;top:calc(46px + env(safe-area-inset-top,0px));aspect-ratio:720/1000;width:100%;max-height:calc(100% - 46px);opacity:0;transition:opacity .6s;pointer-events:none}
.vvid video{width:100%;height:100%;object-fit:contain;object-position:top;display:block;background:#eeeef0}
.vvid .hit{position:absolute;top:0;bottom:0;width:33.3%;background:none;border:0;padding:0;cursor:pointer}
[data-step="q3"] .vvid{opacity:1;pointer-events:auto}
[data-step="q3"] .vars,[data-step="q3"] .arrows,.vars,.arrows{display:none}
[data-step="q3"] .side,[data-step="final"] .side{opacity:0}
[data-step="final"] .word{top:30%;font-size:min(16vw,80px)}
.app[data-step="q3"]{background:#eeeef0}


/* v5: без верхней панели и подписей; слова сверху и за людьми; сцена у стены — ролик; финал — фото Жени */
.hud{display:none!important}
.word{z-index:0;top:2%!important;font-size:min(21vw,100px)}
[data-step="final"] .word{font-size:min(15vw,74px)}
.dolly{z-index:1}
.ba{top:22%}
[data-step="q2"] .word{z-index:5}
.room{top:6%;height:98%}
.room>video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.vvid{top:0!important;max-height:100%!important}
.fin{position:absolute;z-index:2;left:50%;bottom:-6%;height:96%;aspect-ratio:760/1384;transform:translateX(-50%) scale(1.06);opacity:0;filter:blur(8px);
  transition:opacity .9s var(--cam),transform 1.6s var(--out),filter 1s;-webkit-mask-image:linear-gradient(to bottom,#000 72%,transparent 96%);mask-image:linear-gradient(to bottom,#000 72%,transparent 96%)}
.fin img{width:100%;height:100%;display:block}
[data-step="final"] .fin{opacity:1;transform:translateX(-50%);filter:none;transition-delay:.35s}


/* v6: Женя у стены крупнее; метки красные, как «Зона лопаток»: точка → линия выезжает → подпись */
.room{top:-15.5%!important;height:104%!important}
.room.pins .pin{opacity:1}
.room.pins .pin i{background:var(--heat);box-shadow:0 0 0 2.5px #fff,0 3px 10px rgba(255,74,61,.5);transform:scale(0);transition:transform .45s cubic-bezier(.34,1.56,.64,1)}
.room.pins .pin i::after{border-color:var(--heat)}
.room.pins .pin span{color:var(--ink);font-weight:500;opacity:0;transition:opacity .4s,translate .5s var(--out)}
.room.pins .pin.l span{translate:8px 0}.room.pins .pin.r span{translate:-8px 0}
.room.pins .pin span::before{width:34px;background:var(--heat);opacity:.7;transform:scaleX(0);transition:transform .5s var(--out)}
.room.pins .pin.r span::before{transform-origin:left}.room.pins .pin.l span::before{transform-origin:right}
[data-step="q2"] .room.pins .pin i{transform:scale(1);transition-delay:1.3s}
[data-step="q2"] .room.pins .pin span{opacity:1;translate:0 0;transition-delay:1.75s}
[data-step="q2"] .room.pins .pin span::before{transform:scaleX(1);transition-delay:1.5s}
[data-step="q2"] .room.pins .pin.p2 i{transition-delay:1.55s}
[data-step="q2"] .room.pins .pin.p2 span{transition-delay:2s}
[data-step="q2"] .room.pins .pin.p2 span::before{transition-delay:1.75s}

#spred{-webkit-mask-image:radial-gradient(circle at 48% 44%,#000 0%,transparent 0%);mask-image:radial-gradient(circle at 48% 44%,#000 0%,transparent 0%)}
.spring{position:absolute;inset:0;mix-blend-mode:screen;opacity:0;pointer-events:none}
.rfig{top:15.2%!important}

/* Метки на теле */
.pin{position:absolute;width:0;height:0;opacity:0;transition:opacity .6s}
.pin i{position:absolute;left:-5px;top:-5px;width:10px;height:10px;border-radius:50%;background:var(--ink);box-shadow:0 0 0 4px rgba(13,13,15,.08)}
.pin i::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:1px solid var(--ink);animation:ping 2s var(--out) infinite}
@keyframes ping{0%{transform:scale(.4);opacity:.8}100%{transform:scale(1.6);opacity:0}}
.pin span{position:absolute;top:-8px;white-space:nowrap;font:400 10.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);display:flex;align-items:center;gap:6px}
.pin span::before{content:"";width:28px;height:1px;background:var(--hair)}
.pin.r span{left:12px}.pin.l span{right:12px;flex-direction:row-reverse}
[data-step="q2"] .pin{opacity:1;transition-delay:1.4s}

/* Спина крупно */
.back{position:absolute;left:50%;bottom:0;width:min(96%,62vh);aspect-ratio:3/4;transform:translateX(-50%) translateY(5%) scale(1.07);opacity:0;filter:blur(10px);
  transition:opacity .8s ease-out,transform 1.3s var(--out),filter .9s ease-out;-webkit-mask-image:linear-gradient(to bottom,#000 70%,transparent);mask-image:linear-gradient(to bottom,#000 70%,transparent)}
.back img,.back video{width:100%;height:100%;display:block;object-fit:cover}

[data-step="q1"] .glow{opacity:1;transition-delay:1s}
.heatmap{position:absolute;inset:0;animation:glowpulse 2.8s ease-in-out infinite;background:
  radial-gradient(26% 11% at 30% 50%,rgba(255,170,80,1),rgba(255,120,40,.5) 45%,transparent 75%),
  radial-gradient(26% 11% at 66% 49%,rgba(255,170,80,1),rgba(255,120,40,.5) 45%,transparent 75%),
  radial-gradient(14% 17% at 38% 65%,rgba(255,150,60,.85),transparent 72%),
  radial-gradient(14% 17% at 56% 65%,rgba(255,150,60,.85),transparent 72%),
  radial-gradient(11% 13% at 47% 42%,rgba(255,200,120,.9),transparent 72%)}
@keyframes glowpulse{50%{opacity:.6}}
.glow svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.fib{fill:none;stroke:#ffe6c4;stroke-width:9;stroke-linecap:round;opacity:.2;animation:fib 2.6s ease-in-out infinite;animation-delay:var(--k,0s)}
.fib.b{stroke-width:7}
@keyframes fib{50%{opacity:.6}}
.zone{position:absolute;left:49%;top:39%;width:0;height:0}
.zone i{position:absolute;width:150px;height:150px;left:-75px;top:-75px;border-radius:50%;border:1px solid rgba(255,74,61,.6);opacity:0}
[data-step="q1"] .zone i{animation:zone 2.4s var(--out) infinite 1.2s}
.zone i:nth-child(2){animation-delay:2s!important}
@keyframes zone{0%{transform:scale(.3);opacity:.9}100%{transform:scale(1.5);opacity:0}}
.zone span{position:absolute;right:40px;top:-96px;white-space:nowrap;font:400 10.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink);
  background:rgba(255,255,255,.75);backdrop-filter:blur(8px);padding:6px 10px;border-radius:20px;display:flex;align-items:center;gap:7px;opacity:0;transform:translateY(6px);transition:all .6s var(--out)}
.zone span b{width:7px;height:7px;border-radius:50%;background:var(--heat)}
[data-step="q1"] .zone span{opacity:1;transform:none;transition-delay:1.3s}

/* Три варианта над сценой */
.vars{position:absolute;left:0;right:0;top:11%;z-index:6;display:flex;justify-content:center;gap:12px;padding:0 18px;pointer-events:none}
.v{width:29%;max-width:118px;border:0;padding:0;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;
  opacity:0;transform:translateY(40px) scale(.9);transition:transform .9s var(--out),opacity .6s}
[data-step="q3"] .vars{pointer-events:auto}
[data-step="q3"] .v{opacity:1;transform:none}
[data-step="q3"] .v:nth-child(1){transition-delay:.7s}[data-step="q3"] .v:nth-child(2){transition-delay:.85s}[data-step="q3"] .v:nth-child(3){transition-delay:1s}
.v .ph{width:100%;aspect-ratio:480/680;border-radius:18px;overflow:hidden;background:#ddd;box-shadow:0 18px 40px -18px rgba(13,13,15,.45);outline:1.5px solid transparent;outline-offset:3px;transition:outline-color .3s,transform .4s var(--out)}
.v img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.v b{font:500 15px var(--sans);width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--hair);background:#fff;transition:all .3s}
.v.on .ph{outline-color:var(--ink);transform:translateY(-6px)}
.v.on b{background:var(--ink);color:#fff;border-color:var(--ink)}
.arrows{position:absolute;inset:0;z-index:5;pointer-events:none;overflow:visible}
.arrows path{fill:none;stroke:var(--ink);stroke-width:1.2;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;opacity:0}
[data-step="q3"] .arrows path{animation:draw 1s var(--cam) forwards}
[data-step="q3"] .arrows path:nth-child(1){animation-delay:1.3s}
[data-step="q3"] .arrows path:nth-child(2){animation-delay:1.55s}
[data-step="q3"] .arrows path:nth-child(3){animation-delay:1.8s}
@keyframes draw{0%{opacity:1;stroke-dashoffset:1}100%{opacity:1;stroke-dashoffset:0}}

/* панель */
.panel{position:absolute;z-index:10;left:0;right:0;bottom:0;min-height:36%;display:flex;flex-direction:column;justify-content:flex-end;gap:14px;
  padding:56px max(20px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));
  background:linear-gradient(to bottom,rgba(242,242,243,0),rgba(244,244,245,.94) 24%,#f6f6f7 42%)}
.eye{font:400 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);display:flex;gap:10px;align-items:center}
.eye::before{content:"";width:18px;height:1px;background:var(--ink)}
h1{margin:0;font:300 27px/1.14 var(--sans);letter-spacing:-.025em;text-wrap:balance}
h1 em{font-style:normal;font-weight:500}
.sub{margin:0;color:var(--ink2);font-size:14.5px;line-height:1.5;max-width:40ch}
.w{display:inline-block;opacity:0;transform:translateY(.5em);filter:blur(6px);animation:word .8s var(--out) forwards;animation-delay:calc(var(--i)*35ms + var(--base,0ms))}
@keyframes word{to{opacity:1;transform:none;filter:none}}
.acts{display:flex;gap:10px;margin-top:4px}
.btn{flex:1;height:54px;border-radius:27px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px;font:500 15px var(--sans);letter-spacing:-.005em;
  border:1px solid var(--ink);background:transparent;transition:transform .2s var(--out),background .3s,color .3s;opacity:0;transform:translateY(10px);animation:word .7s var(--out) forwards;animation-delay:var(--base,300ms)}
.btn.solid{background:var(--ink);color:#fff}
.btn:active{transform:scale(.97)}
.btn.sm{padding:0;font-size:17px}
.btn.on{background:var(--ink);color:#fff}
.btn svg{flex:none}
.timer{align-self:flex-start;display:flex;align-items:center;gap:10px;height:34px;padding:0 14px 0 6px;border-radius:17px;border:1px solid var(--hair);background:#fff;cursor:pointer;font:400 12px var(--mono);letter-spacing:.04em}
.timer svg{transform:rotate(-90deg)}
.timer circle.p{transition:stroke-dashoffset .25s linear}
.note{font:400 11px var(--mono);color:var(--ink2);letter-spacing:.04em;text-align:center}
.toast{position:absolute;z-index:30;left:50%;top:calc(60px + env(safe-area-inset-top,0px));transform:translate(-50%,-20px);opacity:0;background:var(--ink);color:#fff;font-size:13px;padding:10px 16px;border-radius:20px;transition:all .5s var(--out);pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
:focus-visible{outline:1.5px solid var(--ink);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* v8: сцена у стены — чистая белая студия: ролик 1:2 на всю ширину, Женя спиной к стене, без размытого пятна снизу */
.app[data-step="q2"]{background:#f6f6f7}
.roombg{inset:0 0 -60% 0!important}
.room{top:0!important;left:50%!important;height:auto!important;width:min(100%,50vh)!important;aspect-ratio:1/2!important;-webkit-mask-image:none!important;mask-image:none!important}
@media (min-aspect-ratio:1/2){.room:not(.pins){-webkit-mask-image:linear-gradient(to right,transparent,#000 7%,#000 93%,transparent)!important;mask-image:linear-gradient(to right,transparent,#000 7%,#000 93%,transparent)!important}}
.room>video{object-fit:fill}
.rfig{left:0!important;top:0!important;width:100%!important;height:100%!important}

/* v10: на шаге 2 камера подъезжает к пояснице, метки остаются того же размера */
.room{transform-origin:42.6% 29%}
.room.pins .pin{transform:scale(calc(1 / var(--z,1)))}
/* v16: «Зона лопаток» — на лопатки, а не на шею */

/* v19: ролик у стены на всю ширину, без карточки и надписи; красные акценты на точках касания */

.acc{pointer-events:none}
.acc .ap{position:absolute;width:0;height:0;opacity:0;transition:opacity .35s}
.acc .ap i{position:absolute;left:-6px;top:-6px;width:12px;height:12px;border-radius:50%;background:var(--heat);box-shadow:0 0 0 2.5px #fff,0 2px 10px rgba(255,74,61,.55);transform:scale(0);transition:transform .45s cubic-bezier(.34,1.56,.64,1)}
.acc .ap i::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:1.5px solid var(--heat);animation:ping 1.6s var(--out) infinite}
.acc .ap span{position:absolute;left:15px;top:-12px;white-space:nowrap;font:500 10px var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--ink);background:rgba(255,255,255,.88);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);padding:5px 9px;border-radius:20px;box-shadow:0 2px 10px rgba(0,0,0,.14);opacity:0;translate:-6px 0;transition:opacity .4s,translate .5s var(--out)}
.acc .ap.dn span{top:10px;left:8px}
.acc .ap.on{opacity:1}.acc .ap.on i{transform:scale(1)}.acc .ap.on span{opacity:1;translate:0 0;transition-delay:.15s}
.accl{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.accl line,.accl path{fill:none;stroke:var(--heat);stroke-width:11;stroke-linecap:round;stroke-dasharray:1 1;stroke-dashoffset:1;opacity:.85;filter:drop-shadow(0 0 3px rgba(255,74,61,.7));transition:stroke-dashoffset .9s var(--out),opacity .3s}
.accl line.on,.accl path.on{stroke-dashoffset:0}
.accl line.ref{stroke:#fff;stroke-width:7;stroke-dasharray:.018 .014;stroke-dashoffset:0;opacity:0;filter:none;transition:opacity .4s}
.accl line.ref.on{opacity:.95}

  final:{word:"РЕЗУЛЬТАТ",eye:"Тест пройден",
    h:"Ух ты, вот это <em>результат</em>",
    sub:"Я уже посмотрел ваши ответы. Подробный разбор и с чего начать — в чате.",
    btns:[{t:"Узнать результат",cls:"solid",ico:"go",send:true}]}
};
const ORDER=["intro","q1","q2","q3","final"];
const ans={}; let step="intro";

function words(html,base){
  let i=0; const tmp=document.createElement("div"); tmp.innerHTML=html;
  const walk=n=>{[...n.childNodes].forEach(c=>{ if(c.nodeType===3){ const f=document.createDocumentFragment();
      c.textContent.split(/(\s+)/).forEach(p=>{ if(!p) return; if(/^\s+$/.test(p)){f.appendChild(document.createTextNode(p));return;}
        const s=document.createElement("span"); s.className="w"; s.style.setProperty("--i",i++); s.style.setProperty("--base",base+"ms"); s.textContent=p; f.appendChild(s); });
      c.replaceWith(f); } else walk(c); }); };
  walk(tmp); return tmp.innerHTML;
}

function renderPanel(id,delay){
  const s=STEPS[id]; const parts=[];
  parts.push(`<h1>${words(s.h,delay+120)}</h1>`);
  parts.push(`<p class="sub">${words(s.sub,delay+380)}</p>`);
  if(s.timer) parts.push(`<button class="timer w" style="--i:0;--base:${delay+650}ms" id="tmr" type="button"><svg width="22" height="22" viewBox="0 0 22 22"><circle cx="11" cy="11" r="9" fill="none" stroke="rgba(13,13,15,.12)" stroke-width="2"/><circle class="p" id="tp" cx="11" cy="11" r="9" fill="none" stroke="#0d0d0f" stroke-width="2" stroke-dasharray="56.5" stroke-dashoffset="56.5" stroke-linecap="round"/></svg><span id="tt">Засечь 30 секунд</span></button>`);
  parts.push(`<div class="acts">${s.btns.map((b,k)=>`<button class="btn ${b.cls||""}" style="--base:${delay+700+k*90}ms" data-k="${k}">${b.ico?ICO[b.ico]:""}<span>${b.t}</span></button>`).join("")}</div>`);
  panel.innerHTML=parts.join("");
  panel.querySelectorAll(".btn").forEach(el=>el.onclick=()=>act(id,s.btns[+el.dataset.k],el));
  const t=$("#tmr"); if(t) t.onclick=toggleTimer;
}

function act(id,b,el){
  hap("medium");
  if(b.v&&STEPS[id].key){ ans[STEPS[id].key]=b.v; el.classList.add("on");
    if(id==="q3") document.querySelectorAll(".v").forEach(x=>x.classList.toggle("on",x.dataset.v===b.v)); }
  if(b.send) return send();
  if(b.go) setTimeout(()=>go(b.go), id==="q3"?380:(id==="q1"?0:120));
}

function go(id){ const prev=step;
  const fwd=ORDER.indexOf(id)>ORDER.indexOf(step); step=id; stopTimer();
  // проезд камеры: короткий «наезд» с размытием, затем сцена садится в новое положение
  if(id==="q2"&&prev==="q1") zoomThrough(); else if(id==="q1"&&prev==="intro") whoosh(); else
  $("#dolly").animate([{transform:"none",filter:"blur(0)"},{transform:`translateY(${fwd?-3:3}%) scale(${fwd?1.1:.94})`,filter:"blur(3px)",offset:.45},{transform:"none",filter:"blur(0)"}],{duration:1300,easing:"cubic-bezier(.65,0,.25,1)"});
  const w=$("#word"); w.classList.add("swap"); setTimeout(()=>{w.textContent=STEPS[id].word; w.classList.remove("swap")},520);
  app.dataset.step=id;
  const qi=["q1","q2","q3"].indexOf(id);
  $("#cnt").textContent=qi>=0?`0${qi+1} / 03`:"";
  $("#back").hidden=qi<0;
  document.querySelectorAll(".prog b").forEach((b,k)=>b.style.width=(id==="final"||k<qi)?"100%":k===qi?"100%":"0");
  if(id!=="q3") document.querySelectorAll(".v").forEach(x=>x.classList.remove("on"));
  setMode(id); scanLoop(id);
  const vv=$("#vv"); if(vv){ try{ vv.pause(); vv.currentTime=0; }catch(e){} if(id==="q3") setTimeout(()=>{ if(step==="q3") vv.play().catch(()=>{}); },600); }
  const sv=$("#sv"); if(sv){ if(id==="q2"){ try{sv.currentTime=0;}catch(e){} setTimeout(()=>{ if(step==="q2") sv.play().catch(()=>{}); },500); } else sv.pause(); }
  if(tg&&tg.BackButton){ try{ ["q1","q2","q3"].includes(id)?tg.BackButton.show():tg.BackButton.hide(); }catch(e){} }
  if(id==="q1"){ if(prev!=="intro") $("#backImg").getAnimations().forEach(a=>a.cancel()); revealRed(); }
  renderPanel(id,id==="intro"?200:650);
  if(id==="q3") requestAnimationFrame(drawArrows);
  hap("light");
}
const goBack=()=>{ const p={q1:"intro",q2:"q1",q3:"q2"}[step]; if(p) go(p); };
$("#back").onclick=goBack; if(tg&&tg.BackButton){ try{ tg.BackButton.onClick(goBack); }catch(e){} }
document.querySelectorAll(".v,.vvid .hit").forEach(v=>v.onclick=()=>{
  const k={a:0,b:1,c:2}[v.dataset.v]; const btn=panel.querySelectorAll(".btn")[k]; if(btn) btn.click(); });

/* стрелки от кнопок к фото */
function drawArrows(){
  const svg=$("#arrows"), r=app.getBoundingClientRect(); svg.setAttribute("viewBox",`0 0 ${r.width} ${r.height}`);
  // координаты без учёта анимаций появления (offset* не видит transform)
  const box=(el,host)=>{ let x=0,y=0,n=el; while(n&&n!==host){ x+=n.offsetLeft; y+=n.offsetTop; n=n.offsetParent; } return {x,y,w:el.offsetWidth,h:el.offsetHeight}; };
  const vs=[...document.querySelectorAll(".v .ph")], bs=[...panel.querySelectorAll(".btn")];
  svg.innerHTML=vs.map((p,i)=>{ const a=box(p,app), b=box(bs[i]||bs[0],app);
    const x1=b.x+b.w/2, y1=b.y-10, x2=a.x+a.w/2, y2=a.y+a.h+44;
    const cx=(x1+x2)/2+(i-1)*-40, cy=(y1+y2)/2;
    const ang=Math.atan2(y2-cy,x2-cx), h=8;
    const hx1=x2-h*Math.cos(ang-0.5), hy1=y2-h*Math.sin(ang-0.5), hx2=x2-h*Math.cos(ang+0.5), hy2=y2-h*Math.sin(ang+0.5);
    return `<path pathLength="1" d="M${x1} ${y1} Q${cx} ${cy} ${x2} ${y2} M${hx1} ${hy1} L${x2} ${y2} L${hx2} ${hy2}"/>`; }).join("");
}

/* петля движения Жени на canvas */
const cv=$("#cv"), cx=cv.getContext("2d"); const imgs=FR.map(s=>{const i=new Image(); i.src=s; return i;});
let seq=[0], si=0, mode="still", last=0;
function setMode(id){
  if(id==="q2"){ const N=FR.length, up=[...Array(N).keys()]; seq=[...Array(24).fill(0),...up,...Array(30).fill(N-1),...up.slice().reverse()]; mode="loop"; si=0; }
  else if(id==="final"){ seq=[...Array(FR.length).keys()]; mode="once"; si=0; }
  else if(id==="intro"){ seq=[0]; mode="still"; si=0; }
}
function frame(t){
  if(t-last>31){ last=t; const i=seq[Math.min(si,seq.length-1)]; const im=imgs[i];
    if(im&&im.complete){ [cx,sx,xx].forEach(c=>{ c.clearRect(0,0,408,1092); c.drawImage(im,0,0); }); }
    if(mode==="loop") si=(si+1)%seq.length; else if(mode==="once"&&si<seq.length-1) si++; }
  requestAnimationFrame(frame);
}
const sx=$("#cvs").getContext("2d"), xx=$("#cvx").getContext("2d");
/* красная зона: волна от основания шеи за ~1,9 с, на фронте тёплый блик, потом мягкое «дыхание» */
let rvRaf=null;
function setRed(r,ring,br){
  const f=22, m=`radial-gradient(circle at 48% 44%,#000 ${Math.max(0,r-f)}%,rgba(0,0,0,.55) ${Math.max(0,r-f/2)}%,transparent ${r}%)`;
  const red=$("#spred"); red.style.webkitMaskImage=m; red.style.maskImage=m; red.style.filter=`brightness(${br}) saturate(${br})`;
  const g=$("#spring"); g.style.opacity=ring; g.style.background=`radial-gradient(circle at 48% 44%,transparent ${Math.max(0,r-6)}%,rgba(255,196,120,.8) ${Math.max(0,r-2)}%,transparent ${r+1}%)`;
}
function revealRed(){
  cancelAnimationFrame(rvRaf); setRed(0,0,1); const t0=performance.now()+650;
  const ease=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
  const tick=now=>{ const s=(now-t0)/1000;
    const e=ease(Math.min(1,Math.max(0,(s-0.1)/1.9))), r=70*e;
    const ring=s<0.15?0:s<0.5?(s-0.15)/0.35*0.5:s<1.4?0.5-(s-0.5)/0.9*0.2:Math.max(0,0.3-(s-1.4)/0.4*0.3);
    const br=s<2.1?1:1+0.1*Math.sin((s-2.1)*Math.PI/0.9)*(s<3.9?1:0);
    setRed(r,ring,br);
    if(s<4&&step==="q1") rvRaf=requestAnimationFrame(tick); };
  rvRaf=requestAnimationFrame(tick);
}
/* «вжух»: интро улетает в камеру (в спину Жени «после»), спина крупно раскрывается кругом из этой точки */
function whoosh(){
  const ba=document.querySelector(".ba"), bk=$("#backImg"), fl=$("#flash");
  [ba,bk].forEach(e=>e.style.transition="none");
  ba.animate([{transform:"scale(1)",filter:"blur(0)",opacity:1,visibility:"visible",transformOrigin:"70% 30%"},
              {transform:"scale(5)",filter:"blur(14px)",opacity:0,visibility:"visible",transformOrigin:"70% 30%"}],
             {duration:620,easing:"cubic-bezier(.7,0,.85,.2)"});
  fl.animate([{opacity:0},{opacity:.85,offset:.5},{opacity:0}],{duration:520,delay:330,easing:"ease-out"});
  const a=bk.animate([{transform:"translateX(-50%) scale(.35)",clipPath:"circle(0% at 50% 40%)",filter:"blur(10px)",opacity:1},
              {transform:"translateX(-50%) scale(1.04)",clipPath:"circle(40% at 50% 40%)",filter:"blur(2px)",opacity:1,offset:.55},
              {transform:"translateX(-50%) scale(1)",clipPath:"circle(100% at 50% 40%)",filter:"blur(0)",opacity:1}],
             {duration:1000,delay:380,easing:"cubic-bezier(.16,1,.3,1)",fill:"backwards"});
  a.onfinish=a.oncancel=()=>{ [ba,bk].forEach(e=>e.style.transition=""); };
  hap("heavy");
}
/* подъезд к пояснице: по времени ролика, пока руки наверху */
(function(){
  const sv=$("#sv"), rooms=[...document.querySelectorAll(".room")];
  const ease=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2, ZMAX=1;
  let last=-1;
  function tick(){
    let z=1;
    if(step==="q2"&&sv&&!sv.paused){ const t=sv.currentTime;
      if(t>3.15&&t<3.8) z=1+(ZMAX-1)*ease((t-3.15)/.65);
      else if(t>=3.8&&t<4.9) z=ZMAX;
      else if(t>=4.9&&t<5.5) z=ZMAX-(ZMAX-1)*ease((t-4.9)/.6); }
    if(Math.abs(z-last)>.001){ last=z; rooms.forEach(r=>{ r.style.transform=`translateX(-50%) scale(${z.toFixed(3)})`; r.style.setProperty("--z",z.toFixed(3)); }); }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
/* v21: высота ролика у стены = место над вопросом, чтобы пятки были видны на любом экране; бока режутся */
(function(){ const pn=document.querySelector('.panel');
  function fit(){ const a=app.getBoundingClientRect(), p=pn.getBoundingClientRect(); app.style.setProperty('--rh',Math.max(280,Math.round(p.top-a.top+44))+'px'); }
  fit(); addEventListener('resize',fit); if(window.ResizeObserver) new ResizeObserver(fit).observe(pn);
})();
/* v18: акценты по времени ролика у стены */
(function(){
  const sv=$("#sv"), g=id=>document.getElementById(id);
  const E={bl:g("aBl"),hl:g("aHl"),hd:g("aHd"),lb:g("aLb"),lw:g("aLw"),lc:g("aLc"),la:g("aLa")};
  function tick(){
    const q=step==="q2"&&sv, t=q?sv.currentTime:-1;
    E.lw.classList.toggle("on",q&&t>=.35&&t<3.4);
    E.bl.classList.toggle("on",q&&t>=.25&&t<3.4);
    E.hl.classList.toggle("on",q&&t>=.6&&t<3.4);
    E.hd.classList.toggle("on",q&&t>=2.55&&t<3.4);
    E.lb.classList.toggle("on",q&&t>=3.9);
    E.lc.classList.toggle("on",q&&t>=3.45);
    E.la.classList.toggle("on",q&&t>=3.6);
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
/* наезд камеры «сквозь» кадр: спина улетает в камеру, вспышка, студия со стеной садится с размаха */
function zoomThrough(){
  const E="cubic-bezier(.16,1,.3,1)";
  $("#backImg").animate([{transform:"translateX(-50%) scale(1)",filter:"blur(0)",opacity:1},{transform:"translateX(-50%) scale(3.4)",filter:"blur(16px)",opacity:0}],{duration:560,easing:"cubic-bezier(.7,0,.84,0)",fill:"forwards"});
  $("#flash").animate([{opacity:0},{opacity:.9,offset:.45},{opacity:0}],{duration:760,delay:300,easing:"ease-out"});
  $("#room").animate([{transform:"translateX(-50%) scale(2.3)",filter:"blur(18px)",opacity:0},{opacity:1,offset:.22},{transform:"translateX(-50%) scale(.985)",filter:"blur(0)",offset:.82},{transform:"translateX(-50%) scale(1)",filter:"blur(0)",opacity:1}],{duration:1250,delay:420,easing:E,fill:"backwards"});
  $("#roombg").animate([{transform:"scale(1.8)",opacity:0},{transform:"scale(1)",opacity:1}],{duration:1100,delay:420,easing:E,fill:"backwards"});
  hap("heavy");
}
if(imgs[0]) imgs[0].onload=()=>[cx,sx,xx].forEach(c=>c.drawImage(imgs[0],0,0)); requestAnimationFrame(frame);
/* сканер: на интро повторяется, в финале один раз «тёплый» (мышцы) */
const sideEl=$("#side"); let scanT=null;
function scan(warm){ sideEl.classList.remove("scan","warm"); void sideEl.offsetWidth; sideEl.classList.add("scan"); sideEl.classList.toggle("warm",!!warm); hap("light"); }
function scanLoop(id){ clearInterval(scanT); if(id!=="intro"&&id!=="final") sideEl.classList.remove("scan","warm"); 
  }
scanLoop("intro");

/* параллакс: палец, мышь, наклон телефона */
function tilt(x){ app.style.setProperty("--ry",(x*8).toFixed(2)+"deg"); $("#word").style.transform=`translateX(calc(-50% + ${(-x*14).toFixed(1)}px))`; }
app.addEventListener("pointermove",e=>{const r=app.getBoundingClientRect(); tilt((e.clientX-r.left)/r.width*2-1)});
window.addEventListener("deviceorientation",e=>{ if(e.gamma!=null) tilt(Math.max(-1,Math.min(1,e.gamma/30))) });

/* таймер 30 сек */
let tId=null;
function toggleTimer(){ if(tId){stopTimer();return;} const end=Date.now()+30000; hap("medium");
  tId=setInterval(()=>{ const l=Math.max(0,end-Date.now()); $("#tt").textContent="0:"+String(Math.ceil(l/1000)).padStart(2,"0"); $("#tp").style.strokeDashoffset=56.5*(l/30000);
    if(l<=0){ stopTimer(); $("#tt").textContent="Готово, отвечайте"; hap("ok"); } },200);
  $("#tp").style.strokeDashoffset=56.5; }
function stopTimer(){ if(tId){clearInterval(tId);tId=null;} }

/* отметки в кассу КОДа: она по Telegram ID ставит test_osanka в Salebot и шлёт команду test_osanka_done */
const KASSA="https://functions.yandexcloud.net/d4ec95pbrvop0m7a9ivt";
function hook(ev){ try{
  const u=tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user; if(!u||!u.id) return;
  const qs=new URLSearchParams(location.search), sp=tg.initDataUnsafe.start_param||"";
  const p=new URLSearchParams({test:"osanka",ev:ev,uid:String(u.id),cid:qs.get("cid")||(/^\d+$/.test(sp)?sp:""),
    q1:ans.q1||"",q2:ans.q2||"",q3:ans.q3||"",init:tg.initData||""});
  fetch(KASSA+"?"+p.toString(),{mode:"no-cors",keepalive:true}).catch(()=>{});
}catch(e){} }
function send(){
  hook("done"); hap("ok");
  const t=$("#toast"); t.classList.add("on");
  setTimeout(()=>{ t.classList.remove("on"); if(tg) tg.close(); else { for(const k in ans) delete ans[k]; go("intro"); } },2200);
}

if(tg){ try{ tg.ready(); tg.expand(); hook("open"); tg.setHeaderColor&&tg.setHeaderColor("#c4c5c9"); tg.setBackgroundColor&&tg.setBackgroundColor("#f2f2f3"); }catch(e){} }
renderPanel("intro",200);
window.addEventListener("resize",()=>{ if(step==="q3") drawArrows(); });
</script>
